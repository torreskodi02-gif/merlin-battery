# Merlin Battery — Build APK
# KODI: paste this file into the repo at .github/workflows/build-apk.yml
# via GitHub's web / mobile editor (the GitHub App cannot push workflow
# files). Then every push to main builds a new APK in Releases.
# NOTE: this workflow does NOT use the Gradle wrapper (the wrapper jar is
# binary and cannot be pushed via the snapshot tool), so it installs
# Gradle 7.5 directly with setup-gradle instead.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Do NOT use android-actions/setup-android — v3 tries to install the
      # obsolete 'tools' package and fails (run #1, 2026-11-18). The runner
      # already has an Android SDK; just install the packages we need.
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      - name: Set up Gradle 7.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5'
      - name: Compute version code (shell arithmetic — never '+' in Gradle)
        run: echo "VC=$((10000 + GITHUB_RUN_NUMBER))" >> $GITHUB_ENV
      - name: Build release APK
        run: gradle :app:assembleRelease -PversionCodeProp=$VC --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk merlin-battery.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: merlin-battery-apk
          path: merlin-battery.apk
      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Merlin Battery v1.0.0"
          files: merlin-battery.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
